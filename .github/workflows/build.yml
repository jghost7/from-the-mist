name: build

# Every push and pull request builds the mod. Pushing a tag like v1.0.0 also publishes
# a GitHub Release with the jar attached, versioned from the tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew build
          fi

      # Only the mod itself is published; the sources jar would just confuse people looking for the download.
      - run: rm -f build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: from-the-mist
          path: build/libs/*.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: build/libs/*.jar
